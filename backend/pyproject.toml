[project]
name = "job-hunter-backend"
version = "0.2.0"
description = "Self-hosted job sweep + Gemini scoring backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "apscheduler>=3.10.4",
    "google-genai>=1.0.0",
    "pypdf>=5.1.0",
    "googlesearch-python>=1.2.0",
    "python-jobspy>=1.1.80",
    "pandas>=2.1,<3",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Only needed when GOOGLE_PLAYWRIGHT_ENABLED=true; then run `playwright install chromium`.
playwright = ["playwright>=1.49.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
