name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Migrations apply cleanly
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Doctor (no network)
        run: python -m app.doctor_cli --json || true
        env:
          DATABASE_URL: sqlite:///./ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check dev scripts and extension
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs extension/*.js; do node --check "$f"; done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the CLI directly (the action derives a commit range that fails on a repo's first push).
      - name: gitleaks (full history and working tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-git --no-banner --redact
